name: 🐞 Bug report
description: Something in Buck Tagger isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Computer app (Linux)
        - Computer app (Windows)
        - Phone app
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Trail cam brand / model (if it's about photos)
  - type: markdown
    attributes:
      value: "⚠️ Please don't post photos or screenshots that show your hunting spots or coordinates. This page is public."
